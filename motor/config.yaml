# Configuración del motor de microsimulación actuarial — Sección 6
# Paper Amafore-ITAM 2026 · Equipo Datos México
#
# Todo parámetro marcado PROVISIONAL está registrado en BITACORA_DECISIONES.md
# con el responsable de validarlo.

semilla: 20260701          # semilla global NumPy (reproducibilidad commit 1)

simulacion:
  n_agentes: 5000          # agentes iniciales (población 15-64 en 2025)
  anio_backcast: 1997      # inicio del SAR (ley 97)
  anio_validacion: 2025    # el motor debe reproducir este año
  anio_fin: 2070           # horizonte CONAPO
  paso: anual              # PROVISIONAL: migrar a trimestral si el calendario lo permite

# Unidades: todos los montos en PESOS REALES DE 2025.
# La UMA está indexada a inflación por ley => UMA real constante es exacta
# post-2016 y aproximación aceptable pre-2016 (PROVISIONAL).

# Supuestos macro (NO son ley: ejes del análisis de sensibilidad, Sección 8)
macro:
  pib_2025_mm: 34900000.0        # PROVISIONAL: PIB real 2025 en millones MXN — reemplazar con senda de Sección 8 (Ian)
  crecimiento_pib_real: 0.02     # PROVISIONAL: crecimiento real anual del PIB

economia:
  rendimiento_real_anual: 0.04     # PROVISIONAL: r real constante 4% — calibrar con serie SIEFOREs (rendimientos 36m nominales 6.5-9.4% 2019-2025, client.consar)
  tasa_tecnica_anualidad: 0.03     # PROVISIONAL: tasa técnica real para ä_x — cerrar con Dra. Yáñez
  uma_diaria_2025: 113.14          # DOF/INEGI, valor 2025
  crecimiento_salarial_edad: 0.020 # PROVISIONAL: pendiente inicial del perfil edad-salario
  curvatura_perfil_edad: 0.0004    # PROVISIONAL: decaimiento del crecimiento con la edad
  # Crecimiento salarial real SECULAR (calendario, no edad). Lo consumen los
  # salarios de los agentes Y la proyección del tope FPB — un solo parámetro
  # para que piso y salarios se muevan con la misma fuerza (bitácora #22).
  crecimiento_salarial_secular_real: 0.0  # PROVISIONAL: 0 en el skeleton

salarios:
  mediana_uma_mensual: 3.5   # PROVISIONAL: mediana salario formal en UMAs mensuales — calibrar IMSS/ENOE (Sección 4, Emiliano)
  sigma_log: 0.65            # PROVISIONAL: dispersión lognormal — calibrar ENOE

mercado_laboral:
  # Participaciones observadas ENOE 2025T1 (client.enoe.snapshot_nacional):
  # pob15+ 101.53M, ocupados 58.92M, desocupados 1.48M, informales 32.10M
  # => formal 26.4%, informal 31.6%, desempleo 1.5%, fuera de PEA 40.8%
  persistencia_formal: 0.88      # PROVISIONAL: hand-coded, estimar del panel ENOE (Prioridad 1)
  persistencia_informal: 0.82    # PROVISIONAL
  persistencia_desempleo: 0.30   # PROVISIONAL
  persistencia_fuera: 0.90       # PROVISIONAL
  # Fracción de formales afiliados a ISSSTE (federal 15.2% + estatal 1.2%),
  # ENOE 2025T1 ponderado con fac_tri, variable imssissste (bitácora #25).
  # El motor los modela pero NO aportan al agregado RCV-IMSS (alcance
  # IMSS-solo; IMSS+ISSSTE es decisión de equipo PENDIENTE).
  prop_issste_formales: 0.164

pension_garantizada:
  pg_mensual_2025: 7750.0    # PROVISIONAL: promedio del tabulador post-2020 (edad x semanas x salario); usar tabulador completo en Fase 2 — confirmar con Fabiola/Yáñez

fpb:
  # Tope del complemento FPB. Auditoría 2026-07-18 (bitácora #26, SPEC
  # fondo FPB §3.2): el tope se actualiza cada 1-ene por INFLACIÓN
  # ESTIMADA [V, CONSAR/fpbienestar.org.mx] ⇒ en pesos reales es ≈
  # constante. El ancla antes etiquetada "2026" (17,364.00 = salario
  # promedio IMSS 2025) es en realidad el tope 2025; el oficial 2026 es
  # 17,885.85 (IMSS, +3.0% ≈ inflación estimada).
  tope_mensual_2024: 16777.68  # ancla de LEY — Decreto FPB, DOF 01/05/2024
  tope_mensual_2025: 17364.00  # oficial CONSAR (antes mal etiquetada 2026)
  tope_mensual_2026: 17885.85  # oficial IMSS (comunicado FPB, F1 del SPEC)
  # "legada": interpolación geométrica 2024→"2026" + crecimiento secular
  #   (regla de bitácora #22, CONTRADICHA por fuente primaria; se conserva
  #   como default por la no-regresión bit a bit de Secciones 6-7).
  # "real_constante": anclas nominales deflactadas con INPC a pesos 2025;
  #   2027+ constante en el nivel real del ancla 2026 (regla corregida,
  #   usarla en las corridas de la Sección 8).
  regla_tope: "legada"
  # Piso del complemento: "promedio_carrera" (regla actual, default por
  # no-regresión) | "ultimo_anio" (regla legal [V, F2/F8/Nota 1 EF 2T25]:
  # último salario formal topado — usar en corridas Sección 8).
  definicion_piso: "promedio_carrera"

escenarios:
  base:
    delta_densidad_pp: 0.0
  optimista:
    delta_densidad_pp: 2.0    # +2 pp densidad de cotización (brief §6)
  pesimista:
    delta_densidad_pp: -2.0

# Reformas (Sección 9): overrides de PARÁMETROS DE LEY sobre reglas_sar.PoliticaSAR.
# Los valores vigentes (DOF/CONSAR, con cita) viven en reglas_sar.py y son el
# default; una reforma declara SOLO lo que cambia y desde qué año entra en vigor.
# El backcast 1997-2025 nunca se ve afectado (los overrides aplican desde `desde`).
# Claves de override disponibles: tasa_aportacion_total, semanas_requeridas_fijas,
# edad_retiro, cuota_social_diaria, cuota_social_tope_uma, tope_salarial_uma,
# comision_pct.
reformas:
  semanas_1250:
    descripcion: Revertir el requisito a 1,250 semanas (nivel pre-reforma 2020)
    desde: 2027
    overrides:
      semanas_requeridas_fijas: 1250
